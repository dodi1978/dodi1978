<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TACSI – staff view</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .tag { display: inline-block; padding: 3px 10px; font-weight: 700; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.03em; }
    .tag--urgent { background: #f4cdc6; color: #2a0b06; }
    .tag--high { background: #fcd6c3; color: #6e3619; }
    .tag--standard { background: #bfe3e0; color: #10403c; }
    .tag--status { background: var(--light-grey); color: var(--text); }
    table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    th, td { text-align: left; padding: 12px 10px 12px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-weight: 700; }
    .summary-list { margin: 0 0 30px; }
    .summary-list div { display: grid; grid-template-columns: 220px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .summary-list dt { font-weight: 700; }
    .summary-list dd { margin: 0; }
    .summary-list ul { margin: 0; padding-left: 20px; }
    .transcript { border-left: 5px solid var(--border); padding-left: 15px; }
    .transcript p { margin-bottom: 10px; }
    .transcript .en { color: var(--secondary-text); font-size: 0.9em; display: block; }
    .field { margin-bottom: 20px; }
    .field input { font: inherit; padding: 8px; border: 2px solid var(--input-border); width: 10em; }
    .field label { display: block; font-weight: 700; margin-bottom: 5px; }
    .warning-text { font-weight: 700; border-left: 5px solid var(--red); padding-left: 15px; }
    @media (max-width: 640px) { .summary-list div { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="width-container header__inner">
      <div class="brand"><span class="brand__name">TACSI</span><span class="brand__tag">Staff view</span></div>
    </div>
  </header>
  <main class="width-container main" id="main">
    <div id="app"></div>
  </main>
  <footer class="footer width-container">
    <p>Prototype. Cases are held in memory only and are deleted when the server restarts. <a href="./">Citizen screen</a></p>
  </footer>
  <script type="module" src="staff.js"></script>
</body>
</html>
